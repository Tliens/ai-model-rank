name: Update hotboard
on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分钟拉热榜 RSS（GitHub 调度可能延迟数分钟，属正常）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-hotboard
  cancel-in-progress: true
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-hotboard.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hotboard.json
          git diff --cached --quiet || (git commit -m "chore: hotboard sync $(date -u +%FT%TZ)" && git push)
